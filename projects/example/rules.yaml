schema_version: 1

# 显式指定源语言画像，用于检测译文中残留的连续英文单词。
language:
  source_profile: en
  residue:
    min_run: 3
    # 允许在中文译文中原样保留的英文游戏术语。
    exact_allowlist:
      - HP
      - PvP
    mappings: {}
    scopes: []

