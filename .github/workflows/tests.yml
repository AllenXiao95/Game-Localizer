name: framework-tests

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        pydantic: ["pydantic>=1.10,<2", "pydantic>=2,<3"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install framework
        run: |
          python -m pip install -e .
          python -m pip install "${{ matrix.pydantic }}"
      - name: Run tests
        run: python -X utf8 -m unittest discover -s tests

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full history with gitleaks
        uses: gitleaks/gitleaks-action@v2
