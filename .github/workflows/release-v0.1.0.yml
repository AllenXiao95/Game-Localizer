name: release-v0.1.0

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/release-v0.1.0.yml"
      - ".github/release-notes/v0.1.0.md"
      - "CHANGELOG.md"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: tests (${{ matrix.os }}, ${{ matrix.pydantic }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        pydantic: ["pydantic>=1.10,<2", "pydantic>=2,<3"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Install framework
        run: |
          python -m pip install -e .
          python -m pip install "${{ matrix.pydantic }}"
      - name: Run tests
        shell: pwsh
        run: |
          python -X utf8 -m unittest discover -s tests

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          cache: pip
      - name: Build documentation strictly
        run: |
          python -m pip install -e ".[docs]"
          mkdocs build --strict

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan full history with gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: [tests, docs, secret-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out validated master commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python for release tooling
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify release metadata
        shell: bash
        run: |
          python - <<'PY'
          import pathlib
          import tomllib

          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))
          version = pyproject["project"]["version"]
          if version != "0.1.0":
              raise SystemExit(f"Expected project version 0.1.0, got {version}")

          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          if "## [0.1.0] - 2026-08-24" not in changelog:
              raise SystemExit("CHANGELOG.md does not contain the finalized v0.1.0 release entry")

          notes = pathlib.Path(".github/release-notes/v0.1.0.md")
          if not notes.is_file():
              raise SystemExit("Missing v0.1.0 release notes")
          PY

      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
          cd dist
          sha256sum * > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo "v0.1.0 already exists; leaving the existing release unchanged."
            exit 0
          fi

          gh release create v0.1.0 dist/* \
            --target "$RELEASE_SHA" \
            --title "Game Localizer v0.1.0" \
            --notes-file .github/release-notes/v0.1.0.md \
            --latest
